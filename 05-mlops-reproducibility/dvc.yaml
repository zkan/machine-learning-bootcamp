stages:
  prepare:
    cmd: env PYTHONPATH=lib uv run --no-sync python -m prepare
    deps:
      - ../01-supervised-learning/data/fresh_and_good_customers.csv
      - lib/prepare.py
      - lib/schema.py
      - lib/files.py
    outs:
      - data/customers.parquet
  features:
    cmd: env PYTHONPATH=lib uv run --no-sync python -m features
    deps:
      - data/customers.parquet
      - lib/features.py
      - lib/schema.py
      - lib/files.py
    outs:
      - data/train_features.parquet
      - feature_repo/data/customer_features.parquet
  train:
    cmd: env PYTHONPATH=lib uv run --no-sync python -m train
    deps:
      - data/train_features.parquet
      - lib/train.py
      - lib/registry.py
      - lib/schema.py
      - params.yaml
    params:
      - train.C
      - train.test_size
      - train.random_state
    outs:
      - data/metrics.json
