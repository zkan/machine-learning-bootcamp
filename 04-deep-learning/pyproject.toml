[project]
name = "fresh-and-good-day3"
version = "0.1.0"
description = "Day 3 deep learning workshop for the Machine Learning Bootcamp."
requires-python = "==3.15.2"
dependencies = [
    "numpy==2.5.4",
    "pandas==3.1.1",
    "scikit-learn==1.9.1",
    "mlflow==3.18.0",
    "joblib==1.6.0",
    "streamlit==1.67.0",
    "jupyter==1.1.1",
    "ipykernel==7.4.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "nbclient==0.11.0",
    "nbformat==5.10.4",
]

[tool.uv]
package = false
default-groups = []

[tool.pytest.ini_options]
pythonpath = ["lib"]
testpaths = ["tests"]
filterwarnings = [
    "ignore:codecs.open\\(\\) is deprecated:DeprecationWarning",
]
