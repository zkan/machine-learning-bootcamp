[project]
name = "fresh-and-good-rl"
version = "0.1.0"
description = "Epsilon-greedy bandit for the Machine Learning Bootcamp."
requires-python = "==3.15.2"
dependencies = [
    "numpy==2.5.4",
    "jupyter==1.1.1",
    "ipykernel==7.4.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "nbclient==0.11.0",
    "nbformat==5.10.4",
]

[tool.uv]
package = false
default-groups = []

[tool.pytest.ini_options]
pythonpath = ["lib"]
testpaths = ["tests"]
