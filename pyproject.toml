[project]
name = "klongcart-day1"
version = "0.1.0"
description = "Day 1 local churn workshop for the Machine Learning Bootcamp."
requires-python = "==3.15.2"
dependencies = [
    "numpy==2.5.4",
    "pandas==3.1.1",
    "matplotlib==3.11.2",
    "scikit-learn==1.9.1",
    "joblib==1.6.0",
    "streamlit==1.67.0",
    "jupyter==1.1.1",
    "ipykernel==7.4.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "nbclient==0.11.0",
    "nbformat==5.10.4",
]

[tool.uv]
package = false
default-groups = []

[tool.pytest.ini_options]
pythonpath = ["01-supervised-churn"]
testpaths = ["01-supervised-churn/tests"]
